[build-system]
requires = ["setuptools>=45", "wheel", "setuptools_scm[toml]>=6.2"]
build-backend = "setuptools.build_meta"

[project]
name = "metahuman-attention"
version = "1.0.0"
description = "Deep learning models for attention-based human motion analysis in biomechanical tasks"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "David Santos", email = "hsantos@tamu.edu"}
]
keywords = ["machine-learning", "deep-learning", "attention", "biomechanics", "motion-capture"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

# Keep in step with requirements.txt (the pip install file); hprc/requirements-lock.txt pins the cluster.
dependencies = [
    "torch>=2.4",
    "numpy>=1.21.0",
    "pandas>=1.3.0",
    "pyyaml>=6.0",
    "polars>=1.0.0",
    "scikit-learn>=1.0.0",
    "optuna>=3.0.0",
    "optuna-integration[wandb]>=3.6.0",
    "wandb>=0.16.0",
    "matplotlib>=3.4.0",
    "seaborn>=0.11.0",
    "scipy>=1.7.0",
    "ezc3d>=1.4.0",
    "plotly>=5.0.0",
    "toml>=0.10.0",
    "tabulate>=0.8.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=6.0",
    "pytest-cov>=2.12.0",
    "black>=21.0",
    "flake8>=3.9.0",
    "isort>=5.9.0",
    "mypy>=0.900",
]
docs = [
    "sphinx>=4.0",
    "sphinx-rtd-theme>=1.0",
]
notebooks = [
    "jupyter>=1.0.0",
    "jupyterlab>=3.0.0",
    "ipywidgets>=7.6.0",
]

[project.urls]
Homepage = "https://github.com/hsantos10/Metahuman_Attention"
Documentation = "https://github.com/hsantos10/Metahuman_Attention/blob/main/README.md"
Repository = "https://github.com/hsantos10/Metahuman_Attention.git"
"Bug Tracker" = "https://github.com/hsantos10/Metahuman_Attention/issues"

[tool.setuptools]
packages = ["src", "src.data", "src.utils", "src.pipeline", "chapter1", "chapter1.pipeline", "chapter1.analysis"]

[tool.black]
line-length = 100
target-version = ["py38", "py39", "py310", "py311"]
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
multi_line_mode = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true
line_length = 100
skip_glob = ["*/migrations/*", "*/venv/*"]

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-ra -q --strict-markers --ignore=tests/smoke"
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"

[tool.mypy]
python_version = "3.8"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
disallow_untyped_defs = false

[[tool.mypy.overrides]]
module = [
    "torch.*",
    "optuna.*",
    "ezc3d.*",
    "seaborn.*",
]
ignore_missing_imports = true
